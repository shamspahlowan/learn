# Free Supabase projects pause after 7 days without activity.
# This calls a harmless ping() function twice a week so the tracker stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "https://xzlcubaehmbboraafype.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_lSt4HJ5a1p2qwStnC7Ai5Q_9TWpQrEO" \
            -H "Content-Type: application/json" -d '{}'
